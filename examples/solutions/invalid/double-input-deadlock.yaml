# Compiles, but deadlocks: the processor writes to P2, which is not connected.
schema_version: 1
puzzle: double-input

connections:
  - from: {cell: input, port: P0}
    to: {cell: processor, port: P0}
  - from: {cell: processor, port: P1}
    to: {cell: output, port: P0}

programs:
  processor: |
    MOV P0, ACC
    ADD ACC
    MOV ACC, P2
