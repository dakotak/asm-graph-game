schema_version: 2

id: polynomial-design
name: Polynomial Design
description: |
  For every input x, output 4x + 3.

  Design the hardware yourself. One processor can do it all, but program
  memory is expensive here. Several small processors in a pipeline handle
  values faster, but every processor costs more. Each score dimension
  (hardware cost, worst-case ticks, program bytes) is tracked separately,
  so try both designs.

cells:
  - id: x
    type: input
    config: {stream: x}

  - id: y
    type: output
    config: {stream: y}

hardware:
  max_nodes: 4
  max_cost: 70
  ports: {max: 2}
  catalog:
    standard:
      program_memory: {min: 4, max: 16}
      cost:
        properties:
          program_memory: {cost: 2, per: 4}

limits:
  max_ticks: 5000

tests:
  - name: small
    inputs:
      x: [0, 1, 2, 10, 5, 6, 7, 8]
    outputs:
      y: [3, 7, 11, 43, 23, 27, 31, 35]

  - name: negative
    inputs:
      x: [-1, -3, -100]
    outputs:
      y: [-1, -9, -397]

  - name: overflow
    inputs:
      x: [536870912, 1073741823]
    outputs:
      y: [-2147483645, -1]
